# =============================================
#         AstroMobkill - Configuración
# =============================================

settings:
  # ¿Los mobs de spawners dan dinero?
  spawner-mobs-give-money: false

  # ¿Mostrar mensaje al recibir dinero?
  kill-message: true

  # Formato del mensaje (MiniMessage).
  # Placeholders disponibles: {amount}, {mob}
  kill-message-format: "<green><bold>+${amount}</bold></green> <gray>por matar</gray> <yellow>{mob}</yellow>"

  # Formato cuando el mob NO da dinero (vacío = sin mensaje)
  no-reward-message: ""

  # Redondear el dinero a N decimales (0 = entero)
  decimal-places: 2

  # Multiplicador global de dinero (útil para eventos, etc.)
  global-multiplier: 1.0

# =============================================
#    Configuración por mob
#    min: mínimo dinero que puede dar
#    max: máximo dinero que puede dar
#    enabled: true/false para habilitar/deshabilitar
# =============================================
